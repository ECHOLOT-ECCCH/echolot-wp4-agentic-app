[project]
name = "elexifier-core"
version = "0.1.0"
description = "Elexifier core: settings, database, storage, jobs, crypto, events"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "cryptography>=43",
    "structlog>=24",
]

[build-system]
requires = ["uv_build>=0.7.0,<1.0"]
build-backend = "uv_build"
