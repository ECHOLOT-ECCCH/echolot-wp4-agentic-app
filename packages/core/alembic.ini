# Alembic configuration. Run from the repository root:
#   uv run alembic -c packages/core/alembic.ini upgrade head
# The database URL comes from settings (DATABASE_URL) or -x url=... ; see migrations/env.py.
[alembic]
script_location = %(here)s/src/elexifier_core/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
timezone = UTC
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
