[project]
name = "elexifier-pipeline"
version = "0.1.0"
description = "Elexifier pipeline: conversion code behind stable protocols (XML, PDF, DMLex)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.9",
    "lxml>=5.3",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "xmlschema>=3.4",
    "jsonschema>=4.23",
]

[build-system]
requires = ["uv_build>=0.7.0,<1.0"]
build-backend = "uv_build"
