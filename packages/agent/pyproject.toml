[project]
name = "elexifier-agent"
version = "0.1.0"
description = "Elexifier agent: Pydantic AI agent, toolsets, prompts, model registry"
requires-python = ">=3.12"
dependencies = [
    "elexifier-core",
    "elexifier-pipeline",
    "pydantic-ai-slim[openai,anthropic,google,ui]>=1.0",
]

[build-system]
requires = ["uv_build>=0.7.0,<1.0"]
build-backend = "uv_build"
