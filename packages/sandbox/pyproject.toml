[project]
name = "elexifier-sandbox"
version = "0.1.0"
description = "Elexifier sandbox runner: executes agent-written code in isolated containers"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "docker>=7.1",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.7.0,<1.0"]
build-backend = "uv_build"
