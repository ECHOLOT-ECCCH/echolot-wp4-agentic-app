name: CI

on:
  push:
    branches: [main]
    tags: ["m*", "v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: uv sync
      - run: pnpm install --frozen-lockfile
      - run: make check
      - run: pnpm -C apps/web build

  e2e:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: uv sync
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
      # Playwright starts the API (test model, SQLite under data/e2e) and Vite itself
      - run: pnpm -C apps/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  compose:
    name: Docker images and compose stack
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      # builds web, app and runner, starts them with Prefect, and checks pages, sign-in, a
      # streamed chat turn and a run through the runner, all through Caddy
      - run: deploy/smoke.sh
