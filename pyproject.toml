[project]
name = "echolot-workspace"
version = "0.0.0"
description = "Workspace root for the ECHOLOT agentic workbench (not a package)"
requires-python = ">=3.12"
license = "MIT"
# The root depends on every member so a plain `uv sync` installs the whole workspace.
dependencies = [
    "echolot-app",
    "echolot-runner",
]

[tool.uv.workspace]
members = ["apps/server", "runner"]

[tool.uv.sources]
echolot-app = { workspace = true }
echolot-runner = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "asgi-lifespan>=2",
    # the runner's flow and its tests; the app itself never imports prefect
    "prefect>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/server/src", "runner/src"]
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["apps/server", "runner", "deploy"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv"]
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["apps/server/tests", "runner/runner_tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --import-mode=importlib"
