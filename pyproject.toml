[project]
name = "elexifier-workspace"
version = "0.0.0"
description = "Workspace root for the Elexifier Agentic App (not a package)"
requires-python = ">=3.12"
license = "MIT"
# The root depends on every member so a plain `uv sync` installs the whole workspace.
dependencies = [
    "elexifier-core",
    "elexifier-agent",
    "elexifier-pipeline",
    "elexifier-api",
    "elexifier-sandbox",
]

[tool.uv.workspace]
members = ["apps/api", "packages/*"]

[tool.uv.sources]
elexifier-core = { workspace = true }
elexifier-agent = { workspace = true }
elexifier-pipeline = { workspace = true }
elexifier-api = { workspace = true }
elexifier-sandbox = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "asgi-lifespan>=2",
    "lxml-stubs>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "packages/core/src", "packages/agent/src", "packages/pipeline/src", "packages/sandbox/src"]
extend-exclude = ["packages/core/src/elexifier_core/migrations/versions", "docs", "*.md", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["apps/api", "packages"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv", "packages/core/src/elexifier_core/migrations/versions", "legacy"]
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/core/tests", "packages/agent/tests", "packages/pipeline/tests", "packages/sandbox/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --import-mode=importlib"
markers = ["docker: needs the Docker daemon and the sandbox image (skipped otherwise)"]
