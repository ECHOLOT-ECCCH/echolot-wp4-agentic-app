[project]
name = "elexifier-api"
version = "0.1.0"
description = "Elexifier API: FastAPI application"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "elexifier-core",
    "elexifier-agent",
    "elexifier-pipeline",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "joserfc>=1.0",
]

[build-system]
requires = ["uv_build>=0.7.0,<1.0"]
build-backend = "uv_build"
