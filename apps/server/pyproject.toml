[project]
name = "echolot-app"
version = "0.1.0"
description = "ECHOLOT agentic workbench: FastAPI application, agent and runs"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24",
    "anyio>=4",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.7.0,<1.0"]
build-backend = "uv_build"
