# Scripts run as subprocesses of the app (ECHO_EXECUTOR=local), without Prefect or a runner:
# samples start at once. Only for a single user or a group that trusts each other: a script then
# runs as the app's user, so it can read the app's data and secrets, other users' stored model
# keys included. In .env (without COMPOSE_PROFILES=runner):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.local-runs.yml
services:
  app:
    # the service keys join the app's environment; the runner subprocess inherits them
    env_file:
      - ${APP_ENV_FILE:-.env}
      - ${RUNNER_ENV_FILE:-config/runner.env}
    environment:
      ECHO_EXECUTOR: local
      ECHO_PUBLIC_URL: http://127.0.0.1:8000
      ECHO_LOCAL_SERVICES_FILE: /config/services.toml
    volumes:
      - ${SERVICES_FILE:-./config/services.toml}:/config/services.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
