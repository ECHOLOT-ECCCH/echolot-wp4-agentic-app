# Garage configuration for the compose stack (single node). The secrets are not in this file:
# the garage service gets GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN from the environment
# (docker-compose.yml, values from .env), which Garage reads since v0.8.2.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
